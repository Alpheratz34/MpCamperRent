<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="MpCamperRent">
  <defs>
    <linearGradient id="fvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4332"/>
      <stop offset="100%" stop-color="#0F2219"/>
    </linearGradient>
    <clipPath id="fvClip">
      <rect width="80" height="80" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="80" height="80" rx="16" fill="url(#fvBg)"/>

  <g clip-path="url(#fvClip)">
    <!-- Road -->
    <rect x="0" y="52" width="80" height="28" fill="#0B1C13"/>
    <!-- Road dashes -->
    <rect x="8"  y="58" width="9" height="2.5" rx="1.2" fill="#D4A853" opacity="0.45"/>
    <rect x="36" y="58" width="9" height="2.5" rx="1.2" fill="#D4A853" opacity="0.45"/>
    <rect x="63" y="58" width="9" height="2.5" rx="1.2" fill="#D4A853" opacity="0.45"/>

    <!-- Golden roof stripe -->
    <rect x="5" y="18" width="70" height="4" rx="2" fill="#D4A853"/>

    <!-- Habitation body -->
    <rect x="5" y="22" width="42" height="30" rx="2" fill="#FAF7F2"/>

    <!-- Cab body -->
    <polygon points="47,22 66,22 74,33 74,52 47,52" fill="#EDE9E0"/>

    <!-- Windshield -->
    <polygon points="49,23 65,23 73,33 49,33" fill="#2D7A5E" opacity="0.85"/>

    <!-- Cab side window -->
    <rect x="49" y="34" width="12" height="9" rx="1.5" fill="#2D7A5E" opacity="0.6"/>

    <!-- Hab windows -->
    <rect x="9"  y="26" width="13" height="9" rx="1.5" fill="#2D7A5E"/>
    <rect x="25" y="26" width="13" height="9" rx="1.5" fill="#2D7A5E"/>

    <!-- Door -->
    <rect x="28" y="36" width="11" height="16" rx="1" fill="#E5E1D5"/>
    <circle cx="36.5" cy="44" r="1.8" fill="#D4A853"/>

    <!-- Rear wheel -->
    <circle cx="17" cy="52" r="7.5" fill="#0B1C13"/>
    <circle cx="17" cy="52" r="4.2"  fill="#D4A853"/>
    <circle cx="17" cy="52" r="1.7"  fill="#0B1C13"/>

    <!-- Front wheel -->
    <circle cx="62" cy="52" r="7.5" fill="#0B1C13"/>
    <circle cx="62" cy="52" r="4.2"  fill="#D4A853"/>
    <circle cx="62" cy="52" r="1.7"  fill="#0B1C13"/>
  </g>
</svg>
