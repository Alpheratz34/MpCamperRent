<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="MpCamperRent">
  <!--
    Logo MpCamperRent
    Diseño: silueta de autocaravana sobre carretera con sol naciente
    Paleta: verde bosque (#1B3A2D) + dorado arena (#D4A853)
  -->
  <defs>
    <linearGradient id="mpSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#E8C97A"/>
    </linearGradient>
  </defs>

  <!-- ICONO (autocaravana + sol + carretera) -->
  <g transform="translate(4 8)">
    <!-- Círculo de fondo (sol naciente) -->
    <circle cx="34" cy="34" r="32" fill="#1B3A2D"/>
    <!-- Sol detrás de la autocaravana -->
    <circle cx="34" cy="34" r="20" fill="url(#mpSky)"/>

    <!-- Carretera con líneas discontinuas -->
    <rect x="6" y="52" width="56" height="3" fill="#0F2219"/>
    <line x1="14" y1="53.5" x2="20" y2="53.5" stroke="#D4A853" stroke-width="1.2"/>
    <line x1="28" y1="53.5" x2="34" y2="53.5" stroke="#D4A853" stroke-width="1.2"/>
    <line x1="42" y1="53.5" x2="48" y2="53.5" stroke="#D4A853" stroke-width="1.2"/>

    <!-- Silueta de la autocaravana -->
    <g fill="#FAF7F2" stroke="#0F2219" stroke-width="1.2" stroke-linejoin="round">
      <!-- Cuerpo principal (caja habitable) -->
      <path d="M14 36 L14 30 Q14 28 16 28 L42 28 Q44 28 44 30 L44 24 Q44 22 46 22 L52 22 Q54 22 55 24 L58 36 L58 50 Q58 52 56 52 L16 52 Q14 52 14 50 Z"/>
      <!-- Ventana del habitáculo -->
      <rect x="18" y="32" width="10" height="7" rx="1" fill="#2D5E47" stroke="none"/>
      <!-- Puerta -->
      <rect x="31" y="34" width="7" height="13" rx="0.8" fill="#1B3A2D" stroke="none"/>
      <line x1="36" y1="40" x2="36.4" y2="41" stroke="#D4A853" stroke-width="0.8"/>
      <!-- Parabrisas (cabina) -->
      <path d="M44 24 L52 24 Q53 24 53.4 25 L55.5 30 L44 30 Z" fill="#2D5E47" stroke="none"/>
    </g>

    <!-- Ruedas -->
    <g>
      <circle cx="22" cy="52" r="4" fill="#0F2219"/>
      <circle cx="22" cy="52" r="1.6" fill="#D4A853"/>
      <circle cx="50" cy="52" r="4" fill="#0F2219"/>
      <circle cx="50" cy="52" r="1.6" fill="#D4A853"/>
    </g>
  </g>

  <!-- TEXTO "MpCamperRent" -->
  <g transform="translate(82 0)" font-family="'DM Serif Display', Georgia, serif">
    <text x="0" y="42" font-size="30" fill="#1B3A2D" letter-spacing="-0.5">Mp<tspan fill="#D4A853">CamperRent</tspan></text>
    <!-- Tagline -->
    <text x="2" y="60" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="9" fill="#5A5A5A" letter-spacing="3" font-weight="500">ALQUILER · AVENTURA · LIBERTAD</text>
  </g>
</svg>
